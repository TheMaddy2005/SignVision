<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="160" height="200" rx="16" fill="url(#bg)" stroke="#4ecdc4" stroke-width="2"/>
  <!-- Hand shape -->
  <g transform="translate(80,90)" filter="url(#glow)">
    <g><ellipse cx="0" cy="20" rx="28" ry="32" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5"/><ellipse cx="-32" cy="10" rx="10" ry="16" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5" transform="rotate(-20,-32,10)"/><rect x="-25" y="-52" width="12" height="50" rx="6" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5"/><ellipse cx="-19" cy="-52" rx="6" ry="6" fill="#E8A080"/><rect x="-13" y="-52" width="12" height="50" rx="6" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5"/><ellipse cx="-7" cy="-52" rx="6" ry="6" fill="#E8A080"/><rect x="-1" y="-52" width="12" height="50" rx="6" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5"/><ellipse cx="5" cy="-52" rx="6" ry="6" fill="#E8A080"/><rect x="11" y="-52" width="12" height="50" rx="6" fill="#F4C89A" stroke="#C8945A" stroke-width="1.5"/><ellipse cx="17" cy="-52" rx="6" ry="6" fill="#E8A080"/></g>
  </g>
  <!-- Label -->
  <text x="80" y="175" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="28" font-weight="bold" fill="#4ecdc4">5</text>
  <!-- ISL tag -->
  <text x="80" y="195" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="9" fill="#88aacc">Indian Sign Language</text>
</svg>